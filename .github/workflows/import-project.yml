name: Importar proyecto Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraer proyecto
        run: |
          unzip -q SubtitulosLive2-proyecto.zip -d /tmp/proyecto
          cp -a /tmp/proyecto/SubtitulosLive2/. .
          rm -rf /tmp/proyecto
          rm -f SubtitulosLive2-proyecto.zip

      - name: Guardar archivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Crear proyecto Subtitulos Live 2.0"
          git push
